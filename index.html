<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}</style>
</head><body>
<title>Apex</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: logo header, month calendar, tap a day to log or edit shifts, range totals below. Single dark black-and-white look. */
:root{
  --bg:#0a0a0a;--card:#131313;--raise:#1c1c1c;--fg:#f4f4f4;--muted:#8c8c8c;--line:#2a2a2a;--accent:#ffffff;--accent-fg:#000000;--chip:#262626;--danger:#ff7a6b;
  --sans:"Barlow",system-ui,sans-serif;--display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px}
main{max-width:960px;margin:0 auto;padding-block:20px 48px;padding-inline:16px;display:grid;gap:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{height:56px;width:auto;display:block}
h2{font-family:var(--display);font-size:1rem;text-transform:uppercase;letter-spacing:.12em;margin:0;font-weight:700}
section{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.msg{color:var(--muted);font-size:.85rem;margin:0}.err{color:var(--danger)}
button{font:inherit;font-weight:600;border:1px solid var(--accent);border-radius:4px;padding:8px 14px;background:var(--accent);color:var(--accent-fg);cursor:pointer;text-transform:uppercase;letter-spacing:.06em;font-size:.82rem}
button.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
button.ghost:hover{border-color:var(--fg)}
button:focus-visible,input:focus-visible,.day:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-width:0}
label{display:grid;gap:4px;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.mtitle{font-family:var(--display);font-size:1.5rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;min-width:8em;text-align:center}
.nav{display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);margin-top:12px}
.dow{font-family:var(--display);font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.day{min-height:96px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;background:var(--card)}
.day:hover{background:var(--raise)}
.day.out{opacity:.4}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.tabs button{border:0;border-radius:0;background:transparent;color:var(--muted);padding:8px 14px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.chips{display:flex;flex-direction:column;gap:3px;min-width:0}
.dh{display:flex;gap:6px;align-items:baseline}
.wd{display:none;font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-size:.85rem}
/* 2-week view: two week columns side by side (stacked on phones), one row per day */
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px;margin-top:12px}
.wk{border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0}
.wkh{display:flex;justify-content:space-between;padding:6px 12px;font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:.85rem;color:var(--muted);border-bottom:1px solid var(--line)}
.wkh b{color:var(--fg);font-weight:700}
.dr{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line);cursor:pointer;min-height:40px;box-sizing:border-box}
.dr:last-child{border-bottom:0}
.dr:hover{background:var(--raise)}
.dr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dr .dd{display:flex;align-items:baseline;gap:6px;line-height:1.1}
.dr .dd small{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-size:.75rem}
.dr .dd span{font-family:var(--display);font-weight:700;font-size:1.1rem}
.dr.today .dd span{color:var(--accent-fg);background:var(--accent);border-radius:3px;padding:0 4px}
.shifts{display:grid;gap:4px;min-width:0}
.sh{display:flex;align-items:center;gap:10px;min-width:0}
.ini{font-family:var(--display);font-weight:700;font-size:.9rem;border:1px solid var(--fg);border-radius:3px;min-width:2.2em;text-align:center;padding:0 4px;flex-shrink:0}
.sh .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sh .tm{color:var(--muted);white-space:nowrap;margin-left:auto;font-variant-numeric:tabular-nums}
.dr .hrs{font-variant-numeric:tabular-nums;font-weight:600;min-width:2.5em;text-align:right}
.empty{color:var(--muted);font-size:.85rem;opacity:.6}
@media (max-width:600px){.sh .nm{display:none}.sh .tm{margin-left:0}}
.day.today .num{background:var(--accent);color:var(--accent-fg);border-radius:3px;padding:0 4px;align-self:flex-start}
.num{font-family:var(--display);font-size:.95rem;font-weight:700}
.chip{background:var(--chip);color:var(--fg);border-left:2px solid var(--fg);border-radius:2px;padding:1px 4px;font-size:.74rem;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.chip b{font-weight:600}
@media (max-width:600px){
  .logo{height:44px}.mtitle{font-size:1.15rem;min-width:0}
  .grid.month .day{min-height:64px;padding:3px}
  .grid.month .chip{font-size:.7rem;padding:1px 3px;text-align:center;border-left:0}
  .grid.month .chip .t{display:none}
  .grid.month .dow{padding:4px 2px;font-size:.66rem;text-align:center}
}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:.72rem;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.08em}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}.total td{font-weight:600;border-top:1px solid var(--fg)}
.range{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:10px 0}
.wrap{overflow-x:auto}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);padding:16px;width:min(440px,calc(100vw - 32px));box-sizing:border-box}
dialog::backdrop{background:rgb(0 0 0 / .7)}
dialog h3{margin:0 0 12px;font-family:var(--display);font-size:1.3rem;text-transform:uppercase;letter-spacing:.05em}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.list{display:grid;gap:6px;margin:0 0 14px;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;background:var(--raise);border-radius:4px}
.list li.editing{outline:1px solid var(--fg)}
.acts{display:flex;gap:4px;flex-shrink:0}
.link{background:none;border:0;color:var(--fg);padding:4px 6px;font-weight:500;text-transform:none;letter-spacing:0;font-size:.85rem;text-decoration:underline}
.link.del{color:var(--danger)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
[hidden]{display:none!important}
#lock{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:16px;z-index:10}
#lock form{display:grid;gap:14px;justify-items:center;width:min(300px,100%)}
#lock .logo{height:80px}
#pin{text-align:center;font-size:1.4rem;letter-spacing:.5em;width:100%;box-sizing:border-box}
#lock button{width:100%}
</style>

<style>
.hdr-r{display:flex;align-items:center;gap:12px}
.emps{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin:6px 0 14px}
.emp{display:grid;justify-items:center;gap:2px;padding:12px 4px;border:1px solid var(--line);border-radius:6px;background:var(--raise);color:var(--fg);text-transform:none;letter-spacing:0;font-weight:500}
.emp b{font-family:var(--display);font-size:1.6rem;font-weight:700;letter-spacing:.04em;line-height:1}
.emp small{font-size:.7rem;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emp:hover{border-color:var(--fg)}
.emp[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.emp[aria-pressed="true"] small{color:var(--accent-fg)}
.emp:disabled{opacity:.35;cursor:default}
.emp:disabled:hover{border-color:var(--line)}
.sub{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:.85rem;color:var(--muted);margin:0}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 4px}
dialog.wide{width:min(560px,calc(100vw - 32px))}
.erow{display:grid;grid-template-columns:minmax(0,1fr) 64px auto;gap:8px;align-items:center}
.drow{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.drow span{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.stack{display:grid;gap:8px;margin:8px 0 18px}
.ini-in{text-transform:uppercase;text-align:center}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px}
</style>

    <div class="hdr-r">
      <p class="msg" id="status">Connecting…</p>
      <button class="ghost" id="settingsBtn">Settings</button>
    </div>
  </header>

  <section>
    <div class="row">
      <div class="nav">
        <button class="ghost" id="prev" aria-label="Previous">‹</button>
        <div class="mtitle" id="mlabel"></div>
        <button class="ghost" id="next" aria-label="Next">›</button>
      </div>
      <div class="nav">
        <div class="tabs" role="tablist" aria-label="Calendar view">
          <button type="button" role="tab" id="tabTwo" data-mode="two">2 weeks</button>
          <button type="button" role="tab" id="tabMonth" data-mode="month">Month</button>
        </div>
        <button class="ghost" id="todayBtn">Today</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>

  </section>

  <section>
    <h2>Total hours</h2>
    <div class="range">
      <label>From<input type="date" id="from"></label>
      <label>To<input type="date" id="to"></label>
    </div>
    <p class="msg" id="rangeLabel"></p>
    <div class="wrap"><table><thead><tr><th>Employee</th><th class="r">Shifts</th><th class="r">Hours</th></tr></thead><tbody id="totals"></tbody></table></div>
  </section>
</main>

<dialog id="dlg">
  <h3 id="dlgTitle"></h3>
  <ul class="list" id="dayList"></ul>
  <p class="sub" id="timesLabel">Shift time</p>
  <div class="times">
    <label>Start<input id="start" type="time" step="900" required></label>
    <label>End<input id="end" type="time" step="900" required></label>
  </div>
  <p class="msg" id="calc"></p>
  <label id="dateWrap" hidden style="margin-top:8px">Move to date<input id="date" type="date"></label>
  <p class="sub" id="empLabel" style="margin-top:14px">Tap an employee to log</p>
  <div class="emps" id="emps"></div>
  <p class="msg" id="noEmps" hidden>No employees yet. Add them in Settings.</p>
  <div class="foot">
    <button type="button" class="ghost" id="close">Done</button>
    <div class="btns"><button type="button" class="ghost" id="cancelEdit" hidden>Cancel edit</button><button type="button" id="saveEdit" hidden>Save changes</button></div>
  </div>
</dialog>

<dialog id="settings" class="wide">
  <h3>Settings</h3>
  <p class="sub">Employees</p>
  <div class="stack" id="empRows"></div>
  <button type="button" class="ghost" id="addEmp">Add employee</button>
  <p class="sub" style="margin-top:18px">Default shift times</p>
  <div class="stack" id="dayRows"></div>
  <p class="msg err" id="setErr" hidden></p>
  <div class="foot">
    <button type="button" class="ghost" id="setCancel">Cancel</button>
    <button type="button" id="setSave">Save settings</button>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let shifts = [], employees = [], defaults = {}, password = '';
let view = new Date(), selected = null, editingId = null, editEmp = null;
view.setDate(1);
const iso = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const todayIso = () => iso(new Date());
const fmtH = h => (Math.round(h*100)/100).toString();
const longDate = s => new Date(s+'T00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
const shortDate = s => new Date(s+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const sunday = d => { const m=new Date(d); m.setHours(0,0,0,0); m.setDate(m.getDate()-m.getDay()); return m; };
let wkStart = sunday(new Date());
let mode = matchMedia('(max-width:600px)').matches ? 'two' : 'month';
try { mode = localStorage.getItem('apexMode') || mode; } catch {}

function initialsOf(n){ const p=n.trim().split(/\s+/); return (p.length>1 ? p.map(w=>w[0]).join('') : p[0].slice(0,2)).toUpperCase(); }
const empById = id => employees.find(e=>e.id===id);
const nameOf = s => empById(s.employeeId)?.name || s.name;
const iniOf = s => empById(s.employeeId)?.initials || initialsOf(nameOf(s));
function mins(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function hoursBetween(s,e){ let d=mins(e)-mins(s); if(d<=0) d+=1440; return d/60; }
function t12(t){ const [h,m]=t.split(':').map(Number); return {txt:(h%12||12)+(m?':'+String(m).padStart(2,'0'):''), ap:h<12?'am':'pm'}; }
function span(s,e){ const a=t12(s), b=t12(e); return a.ap===b.ap ? `${a.txt}-${b.txt}${b.ap}` : `${a.txt}${a.ap}-${b.txt}${b.ap}`; }
const label = s => s.start && s.end ? span(s.start,s.end) : fmtH(s.hours)+'h';
const dayDefault = k => defaults[new Date(k+'T00:00').getDay()] || {start:'14:00',end:'21:00'};
const el = (tag, cls, text) => { const x=document.createElement(tag); if(cls) x.className=cls; if(text!==undefined) x.textContent=text; return x; };
const byDate = () => { const m={}; shifts.forEach(s=>(m[s.date] ||= []).push(s)); for(const k in m) m[k].sort((a,b)=>(a.start||'').localeCompare(b.start||'')); return m; };

function setRangeToView(){
  if(mode==='two'){ const e=new Date(wkStart); e.setDate(e.getDate()+13); $('from').value=iso(wkStart); $('to').value=iso(e); return; }
  $('from').value = iso(new Date(view.getFullYear(), view.getMonth(), 1));
  $('to').value = iso(new Date(view.getFullYear(), view.getMonth()+1, 0));
}

function dayClick(node, k){
  node.tabIndex=0; node.setAttribute('role','button'); node.setAttribute('aria-label',longDate(k));
  node.onclick=()=>openDay(k);
  node.onkeydown=ev=>{ if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();openDay(k);} };
}

function renderCal(){
  const g=$('grid'); g.replaceChildren();
  $('tabTwo').setAttribute('aria-selected', mode==='two'); $('tabMonth').setAttribute('aria-selected', mode==='month');
  const days=byDate(), today=todayIso();
  if(mode==='two') return renderTwo(g, days, today);
  g.className='grid month';
  $('mlabel').textContent = view.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  DAYS.forEach(d=>g.append(el('div','dow',d)));
  const lead=view.getDay();
  const first=new Date(view); first.setDate(1-lead);
  const last=new Date(view.getFullYear(), view.getMonth()+1, 0);
  const cells=Math.ceil((lead+last.getDate())/7)*7;
  for(let i=0;i<cells;i++){
    const d=new Date(first); d.setDate(first.getDate()+i); const k=iso(d);
    const c=el('div','day'+(d.getMonth()!==view.getMonth()?' out':'')+(k===today?' today':''));
    const dh=el('div','dh'); dh.append(el('span','num',d.getDate()));
    const chips=el('div','chips'); c.append(dh,chips);
    (days[k]||[]).forEach(s=>{
      const ch=el('div','chip'); ch.title=`${nameOf(s)} ${label(s)} (${fmtH(s.hours)}h)`;
      ch.append(el('b',null,iniOf(s)), el('span','t',' '+label(s))); chips.append(ch);
    });
    dayClick(c,k); g.append(c);
  }
}

function renderTwo(g, days, today){
  g.className='weeks';
  const f=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  const end=new Date(wkStart); end.setDate(end.getDate()+13);
  $('mlabel').textContent=`${f(wkStart)} – ${f(end)}`;
  for(let w=0;w<2;w++){
    const ws=new Date(wkStart); ws.setDate(ws.getDate()+7*w);
    const box=el('div','wk'), head=el('div','wkh'), ht=el('b');
    head.append(el('span',null,'Week of '+f(ws)), ht); box.append(head);
    let wkHours=0;
    for(let i=0;i<7;i++){
      const d=new Date(ws); d.setDate(ws.getDate()+i); const k=iso(d);
      const r=el('div','dr'+(k===today?' today':''));
      const dd=el('div','dd'); dd.append(el('small',null,DAYS[d.getDay()]), el('span',null,d.getDate()));
      const sh=el('div','shifts'); let dayH=0;
      const list=days[k]||[];
      if(!list.length) sh.append(el('span','empty','—'));
      list.forEach(s=>{ dayH+=s.hours; const row=el('div','sh'); row.append(el('span','ini',iniOf(s)), el('span','nm',nameOf(s)), el('span','tm',label(s))); sh.append(row); });
      wkHours+=dayH;
      r.append(dd, sh, el('span','hrs', dayH?fmtH(dayH)+'h':''));
      dayClick(r,k); box.append(r);
    }
    ht.textContent=fmtH(wkHours)+'h'; g.append(box);
  }
}

function renderTotals(){
  let a=$('from').value, b=$('to').value;
  if(a&&b&&a>b) [a,b]=[b,a];
  $('rangeLabel').textContent = a&&b ? `${shortDate(a)} – ${shortDate(b)}` : 'Pick a date range.';
  const T=$('totals'); T.replaceChildren();
  const by=new Map();
  shifts.filter(s=>(!a||s.date>=a)&&(!b||s.date<=b)).forEach(s=>{
    const key=s.employeeId||s.name; const t=by.get(key)||{name:nameOf(s), ini:iniOf(s), h:0, n:0};
    t.h+=s.hours; t.n++; by.set(key,t);
  });
  const rows=[...by.values()].sort((x,y)=>x.name.localeCompare(y.name));
  if(!rows.length){ const r=el('tr'), c=el('td','msg','No hours logged in this range.'); c.colSpan=3; r.append(c); T.append(r); return; }
  let gh=0,gn=0;
  rows.forEach(t=>{ const r=el('tr'); r.append(el('td',null,`${t.name} (${t.ini})`), el('td','r',t.n), el('td','r',fmtH(t.h))); T.append(r); gh+=t.h; gn+=t.n; });
  const r=el('tr','total'); r.append(el('td',null,'Total'), el('td','r',gn), el('td','r',fmtH(gh))); T.append(r);
}

function renderDay(){
  if(!selected) return;
  $('dlgTitle').textContent=longDate(selected);
  const L=$('dayList'); L.replaceChildren();
  const list=byDate()[selected]||[];
  list.forEach(s=>{
    const li=el('li', s.id===editingId?'editing':'');
    const acts=el('div','acts');
    const ed=el('button','link','Edit'); ed.type='button'; ed.onclick=()=>startEdit(s);
    const del=el('button','link del','Remove'); del.type='button';
    del.onclick=async()=>{
      if(!del.dataset.armed){ del.dataset.armed=1; del.textContent='Confirm'; setTimeout(()=>{ delete del.dataset.armed; del.textContent='Remove'; },3000); return; }
      try{ apply(await api('POST',{op:'delete',id:s.id})); if(editingId===s.id) stopEdit(); status('Shift removed'); }
      catch(err){ status('Could not remove: '+err.message,true); }
    };
    acts.append(ed,del); li.append(el('span',null,`${nameOf(s)} · ${label(s)} · ${fmtH(s.hours)}h`), acts); L.append(li);
  });
  L.hidden=!list.length;

  const logged=new Set(list.map(s=>s.employeeId||s.name));
  const E=$('emps'); E.replaceChildren();
  employees.forEach(e=>{
    const b=el('button','emp'); b.type='button';
    b.append(el('b',null,e.initials), el('small',null,e.name));
    if(editingId){
      b.setAttribute('aria-pressed', e.id===editEmp?.id);
      b.onclick=()=>{ editEmp=e; renderDay(); };
    } else {
      b.disabled=logged.has(e.id)||logged.has(e.name);
      b.title=b.disabled?`${e.name} is already logged today`:`Log ${e.name}`;
      b.onclick=()=>logShift(e,b);
    }
    E.append(b);
  });
  $('noEmps').hidden=!!employees.length;
  $('empLabel').textContent = editingId ? 'Employee' : 'Tap an employee to log';
  $('timesLabel').textContent = editingId ? 'Edit shift' : `Shift time (${DAYS[new Date(selected+'T00:00').getDay()]} default)`;
}

function updateCalc(){ const s=$('start').value,e=$('end').value; $('calc').textContent = s&&e ? `${span(s,e)} = ${fmtH(hoursBetween(s,e))} hours` : ''; }

async function logShift(e, btn){
  const start=$('start').value, end=$('end').value;
  if(!start||!end) return status('Pick a start and end time first.', true);
  btn.disabled=true;
  try{ apply(await api('POST',{op:'add',shift:{employeeId:e.id,name:e.name,date:selected,start,end,hours:hoursBetween(start,end)}})); status(`Logged ${e.initials} ${span(start,end)}`); }
  catch(err){ btn.disabled=false; status('Could not save: '+err.message,true); }
}

function startEdit(s){
  editingId=s.id; editEmp=empById(s.employeeId)||{id:s.employeeId,name:s.name,initials:initialsOf(s.name)};
  $('start').value=s.start||dayDefault(s.date).start; $('end').value=s.end||dayDefault(s.date).end; $('date').value=s.date;
  $('dateWrap').hidden=false; $('cancelEdit').hidden=false; $('saveEdit').hidden=false;
  updateCalc(); renderDay();
}
function stopEdit(){
  editingId=null; editEmp=null;
  $('dateWrap').hidden=true; $('cancelEdit').hidden=true; $('saveEdit').hidden=true;
  if(selected){ const d=dayDefault(selected); $('start').value=d.start; $('end').value=d.end; updateCalc(); }
  renderDay();
}
$('saveEdit').onclick=async()=>{
  const start=$('start').value, end=$('end').value;
  if(!start||!end||!editEmp) return;
  try{
    apply(await api('POST',{op:'update',id:editingId,shift:{employeeId:editEmp.id,name:editEmp.name,date:$('date').value||selected,start,end,hours:hoursBetween(start,end)}}));
    stopEdit(); status('Shift updated');
  }catch(err){ status('Could not save: '+err.message,true); }
};

function render(){ renderCal(); renderTotals(); renderDay(); }
function status(t,bad){ $('status').textContent=t; $('status').className='msg'+(bad?' err':''); }
function apply(d){
  shifts=(d.shifts||[]).filter(s=>s.name&&s.date&&typeof s.hours==='number');
  employees=d.employees||[]; defaults=d.defaults||{};
  render();
}

function openDay(k){ selected=k; stopEdit(); $('dlg').showModal(); }
$('close').onclick=()=>$('dlg').close();
$('cancelEdit').onclick=stopEdit;
$('dlg').addEventListener('close',()=>{ editingId=null; editEmp=null; selected=null; });
$('start').oninput=$('end').oninput=updateCalc;
function step(n){ if(mode==='two') wkStart.setDate(wkStart.getDate()+14*n); else view.setMonth(view.getMonth()+n); setRangeToView(); render(); }
$('prev').onclick=()=>step(-1);
$('next').onclick=()=>step(1);
$('todayBtn').onclick=()=>{ view=new Date(); view.setDate(1); wkStart=sunday(new Date()); setRangeToView(); render(); };
$('from').onchange=$('to').onchange=renderTotals;
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  if(mode===b.dataset.mode) return;
  mode=b.dataset.mode; try{ localStorage.setItem('apexMode',mode); }catch{}
  // keep the two views on the same stretch of time when switching
  if(mode==='two'){ const t=sunday(new Date()); wkStart=(t.getMonth()===view.getMonth()&&t.getFullYear()===view.getFullYear())?t:sunday(view); }
  else { view=new Date(wkStart); view.setDate(1); }
  setRangeToView(); render();
});

/* Settings */
function empRow(e){
  const r=el('div','erow'); r.dataset.id=e.id||'';
  const n=el('input'); n.value=e.name||''; n.placeholder='Full name'; n.className='nm-in'; n.setAttribute('aria-label','Employee name');
  const i=el('input','ini-in'); i.value=e.initials||''; i.maxLength=3; i.placeholder='JD'; i.setAttribute('aria-label','Initials');
  n.oninput=()=>{ if(!i.dataset.touched) i.value=n.value.trim()?initialsOf(n.value):''; };
  i.oninput=()=>{ i.dataset.touched=1; };
  if(e.initials) i.dataset.touched=1;
  const x=el('button','link del','Remove'); x.type='button'; x.onclick=()=>r.remove();
  r.append(n,i,x); return r;
}
$('settingsBtn').onclick=()=>{
  $('empRows').replaceChildren(...employees.map(empRow));
  $('dayRows').replaceChildren(...DAYS.map((d,idx)=>{
    const r=el('div','drow'); const t=defaults[idx]||{start:'',end:''};
    const s=el('input'); s.type='time'; s.step=900; s.value=t.start; s.setAttribute('aria-label',d+' start');
    const e=el('input'); e.type='time'; e.step=900; e.value=t.end; e.setAttribute('aria-label',d+' end');
    r.append(el('span',null,d), s, e); return r;
  }));
  $('setErr').hidden=true; $('settings').showModal();
};
$('addEmp').onclick=()=>{ const r=empRow({}); $('empRows').append(r); r.querySelector('input').focus(); };
$('setCancel').onclick=()=>$('settings').close();
$('setSave').onclick=async()=>{
  const emps=[...$('empRows').children].map(r=>({id:r.dataset.id||undefined, name:r.children[0].value.trim(), initials:r.children[1].value.trim()})).filter(e=>e.name);
  const defs={}; [...$('dayRows').children].forEach((r,idx)=>{ defs[idx]={start:r.children[1].value, end:r.children[2].value}; });
  if(Object.values(defs).some(t=>!t.start||!t.end)){ $('setErr').textContent='Every day needs a start and end time.'; $('setErr').hidden=false; return; }
  try{ apply(await api('POST',{op:'settings',employees:emps,defaults:defs})); $('settings').close(); status('Settings saved'); }
  catch(err){ $('setErr').textContent='Could not save: '+err.message; $('setErr').hidden=false; }
};

/* Server */
async function api(method, body){
  const res = await fetch('/api/shifts', {method, headers:{'content-type':'application/json','x-apex-password':password}, body: body?JSON.stringify(body):undefined, cache:'no-store'});
  const data = await res.json().catch(()=>({}));
  if(!res.ok){ const e=new Error(data.error||('Server error '+res.status)); e.status=res.status; throw e; }
  return data;
}
async function refresh(){
  try{ const d=await api('GET'); apply(d); status(shifts.length+' shifts saved'); }
  catch(err){
    if(err.status===401){ try{ sessionStorage.removeItem('apexPw'); }catch{} location.reload(); return; }
    status('Could not load shifts: '+err.message, true);
  }
}

let started=false;
function start(){
  if(started) return; started=true;
  $('lock').hidden=true; $('app').hidden=false;
  setRangeToView(); render();
  // pick up changes other people made
  setInterval(()=>{ if(!document.hidden && !$('dlg').open && !$('settings').open) refresh(); }, 30000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden && !$('settings').open) refresh(); });
}

$('lockForm').addEventListener('submit', async ev=>{
  ev.preventDefault();
  password=$('pin').value;
  try{ const d=await api('GET'); try{ sessionStorage.setItem('apexPw',password); }catch{} start(); apply(d); status(shifts.length+' shifts saved'); }
  catch(err){ $('pinErr').textContent = err.status===401 ? 'Wrong password. Try again.' : 'Could not reach the server: '+err.message; $('pinErr').hidden=false; $('pin').value=''; $('pin').focus(); }
});
try{ password=sessionStorage.getItem('apexPw')||''; }catch{}
if(password){ start(); refresh(); } else $('pin').focus();
</script>
</body></html>
